<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多AI聊天台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="logo">◆</span><span>多AI聊天台</span></div>

    <div class="budget-card">
      <div class="budget-top"><span>本月花费</span><b id="spend">¥0.0000</b></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="budget-bottom">
        <span id="budgetText" class="tiny">预算 ¥100</span>
        <span>
          <button id="btn-stats" class="link">明细</button>
          <button id="btn-settings" class="link">设置</button>
        </span>
      </div>
    </div>

    <div class="sec-title">成员 <span id="memberCount" class="count"></span></div>
    <ul id="members" class="members"></ul>

    <div class="sec-title">Agent（预留）</div>
    <div class="agent-slot">
      <div class="agent-item"><span>WorkBuddy</span><span class="tiny">下个版本</span></div>
      <div class="agent-item"><span>ecode</span><span class="tiny">下个版本</span></div>
    </div>
    <div class="foot tiny">本地运行 · 数据不出本机</div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div id="chatTitle">新对话</div>
      <div class="top-actions">
        <button id="btn-history" class="ghost">历史</button>
        <button id="btn-export" class="ghost">导出</button>
        <button id="btn-clear" class="ghost">清空</button>
      </div>
    </header>

    <div id="scroll" class="scroll">
      <div id="messages" class="messages"></div>
      <div id="empty" class="empty">
        <div class="empty-icon">◆</div>
        <p>在下面 <b>@</b> 一个 AI 开始。</p>
        <p class="tiny">可以同时 @ 多个，它们会各自回答。<br>任何一条回复都能转发给另一个 AI 继续讨论。</p>
      </div>
    </div>

    <div id="composer" class="composer">
      <div id="mentionPopup" class="mention-popup hidden"></div>
      <textarea id="input" rows="1" placeholder="输入消息，@ 某个 AI 让它回答；Enter 发送，Shift+Enter 换行"></textarea>
      <div class="composer-bar">
        <label class="switch"><input type="checkbox" id="fullContext"> 带全部上下文</label>
        <div class="spacer"></div>
        <span id="hint" class="tiny"></span>
        <button id="btn-send" class="primary">发送</button>
      </div>
    </div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><b id="modalTitle">设置</b><button id="modalClose" class="ghost">✕</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="fwdMenu" class="fwd-menu hidden"></div>

<script src="/app.js"></script>
</body>
</html>
